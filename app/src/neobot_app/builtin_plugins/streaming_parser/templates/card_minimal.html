<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=720">
{{font_style}}
<style>
  /* ===== 极简浅色风格开播/下播卡片（原创，纯 CSS 绘制，无阴影） ===== */
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; width: 720px; background-color: #ffffff; }
  body {
    font-family: "FusionPixel", "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .card {
    position: relative;
    width: 720px;
    overflow: hidden;
    padding: 28px;
    background-color: #ffffff;
  }

  .inner {
    position: relative;
    border: 1px solid #e6e6ec;
    border-radius: 10px;
    padding: 22px;
    background: #ffffff;
  }

  /* 顶栏：右上角品牌小字 */
  .topbar {
    display: flex; align-items: center; justify-content: flex-end;
    margin-bottom: 18px; padding-bottom: 12px;
    border-bottom: 1px solid #f0f0f4;
  }
  .brand {
    font-size: 11px; font-weight: 600; letter-spacing: .22em;
    text-transform: uppercase; color: #9a9aa8;
  }

  /* 封面 16:9 */
  .cover-wrap {
    position: relative; width: 100%; padding-top: 56.25%;
    border-radius: 6px; overflow: hidden; background: #f4f4f7;
  }
  .cover { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
  .cover-shade {
    position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    background: linear-gradient(180deg, rgba(20, 20, 28, 0) 52%, rgba(20, 20, 28, .46) 100%);
  }
  .status {
    position: absolute; left: 12px; bottom: 12px;
    display: inline-flex; align-items: center; gap: 8px;
    padding: 7px 14px; border-radius: 4px;
    font-size: 15px; font-weight: 700; letter-spacing: .06em; color: #232329;
    background: rgba(255, 255, 255, .95);
  }
  .status::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: #fb7299; }

  .profile { display: flex; align-items: flex-start; gap: 18px; margin-top: 22px; }
  .avatar {
    flex: 0 0 auto; width: 96px; height: 96px;
    border-radius: 50%; object-fit: cover; display: block;
    border: 1px solid #e6e6ec; background: #f4f4f7;
  }
  .who { flex: 1 1 auto; min-width: 0; padding-top: 3px; }
  .name {
    font-size: 26px; line-height: 1.25; font-weight: 700; letter-spacing: .01em; color: #17171c;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .title {
    margin-top: 9px;
    font-size: 16px; line-height: 1.55; color: #5c5c68;
    overflow-wrap: anywhere; word-break: break-word;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    overflow: hidden; max-height: 50px;
  }

  .meta { display: flex; align-items: center; flex-wrap: wrap; gap: 16px; margin-top: 18px; }
  .tag {
    display: inline-flex; align-items: center; padding: 3px 10px;
    border: 1px solid #e6e6ec; border-radius: 4px;
    font-size: 12px; letter-spacing: .04em; color: #6b6b78; background: #fafafc;
  }
  .stat { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; color: #6b6b78; }
  .stat::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: #fb7299; }
  .tag:empty, .stat:empty { display: none; }

  /* 开播时间：空字符串时整块隐藏，不留空白 */
  .live-time {
    position: relative; display: inline-flex; align-items: center;
    margin-top: 14px; padding: 2px 0 2px 15px;
    font-size: 13px; color: #4a4a55; border-left: 2px solid #fb7299;
  }
  .live-time:empty { display: none; }

  .foot {
    display: flex; align-items: center; justify-content: space-between;
    margin-top: 18px; padding-top: 12px;
    border-top: 1px solid #f0f0f4;
  }
  .room { font-size: 12px; letter-spacing: .08em; color: #9a9aa8; }
  .room:empty { display: none; }
  .mark { display: inline-flex; align-items: center; gap: 6px; }
  .mark i { display: block; width: 5px; height: 5px; border-radius: 50%; background: #e0e0e6; }
  .mark i:nth-child(3) { background: #fb7299; }
</style>
</head>
<body>
  <div class="card">
    <div class="inner">
      <div class="topbar">
        <span class="brand">{{host_label}}</span>
      </div>

      <div class="cover-wrap">
        <img class="cover" src="{{cover_src}}" alt="">
        <span class="cover-shade"></span>
        <span class="status">{{status_text}}</span>
      </div>

      <div class="profile">
        <img class="avatar" src="{{avatar_src}}" alt="">
        <div class="who">
          <div class="name">{{name}}</div>
          <div class="title">{{title}}</div>
        </div>
      </div>

      <div class="meta"><span class="tag">{{area_name}}</span><span class="stat">{{online_text}}</span></div>

      <div class="live-time">{{live_time_text}}</div>

      <div class="foot">
        <span class="room">{{room_id}}</span>
        <span class="mark"><i></i><i></i><i></i></span>
      </div>
    </div>
  </div>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=720">
{{font_style}}
<style>
  /* ===== 极简浅色风格 · 开播状态总览图（原创，纯 CSS 绘制，无阴影） ===== */
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; width: 720px; background-color: #ffffff; }
  body {
    font-family: "FusionPixel", "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .card { position: relative; width: 720px; overflow: hidden; padding: 28px; background: #ffffff; }

  .inner {
    position: relative; background: #ffffff;
    border: 1px solid #e6e6ec; border-radius: 10px; padding: 24px 22px 22px;
  }

  .head {
    display: flex; align-items: flex-end; justify-content: space-between; gap: 16px;
    padding-bottom: 15px; margin-bottom: 20px;
    border-bottom: 1px solid #f0f0f4;
  }
  .head-title {
    font-size: 24px; line-height: 1.3; font-weight: 700; letter-spacing: .01em; color: #17171c;
  }
  .head-title::before {
    content: ""; display: inline-block; vertical-align: 3px;
    width: 6px; height: 6px; margin-right: 10px; border-radius: 50%; background: #fb7299;
  }
  .head-summary { margin-top: 7px; font-size: 13px; letter-spacing: .02em; color: #9a9aa8; }
  .head-summary:empty { display: none; }
  .head-mark { flex: 0 0 auto; display: inline-flex; align-items: flex-end; gap: 4px; height: 18px; }
  .head-mark i { display: block; width: 4px; border-radius: 1px; background: #e0e0e6; }
  .head-mark i:nth-child(1) { height: 8px; }
  .head-mark i:nth-child(2) { height: 13px; }
  .head-mark i:nth-child(3) { height: 18px; background: #fb7299; }

  .grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 24px 14px;
  }

  /* ===== 主播格子（由渲染端生成 grid 片段，类名契约固定） ===== */
  .host {
    display: flex; flex-direction: column; align-items: center; gap: 12px;
    min-width: 0; padding-top: 8px;
  }
  .host-avatar {
    position: relative; display: inline-flex; flex: 0 0 auto;
    width: 88px; height: 88px; border-radius: 50%;
  }
  .host-avatar img {
    width: 100%; height: 100%; border-radius: 50%; object-fit: cover; display: block;
    background: #f4f4f7; border: 1px solid #ececf1;
  }
  /* 开播中：B 站同款粉色圈圈（主色 #FB7299） */
  .host-live .host-avatar::before {
    content: ""; position: absolute; top: -6px; left: -6px; right: -6px; bottom: -6px;
    border-radius: 50%; border: 2px solid #fb7299;
  }
  .host:not(.host-live) .host-avatar { opacity: .55; }
  .host-live .host-avatar img { border-color: #ffffff; }
  /* LIVE 角标 */
  .host-badge {
    display: none; position: absolute; right: -10px; bottom: 0;
    align-items: center; padding: 2px 6px; border-radius: 4px;
    font-size: 9px; font-weight: 700; letter-spacing: .1em; line-height: 1.5;
    color: #ffffff; background: #fb7299; border: 2px solid #ffffff;
  }
  .host-live .host-badge { display: inline-flex; }
  .host-name {
    width: 100%; text-align: center;
    font-size: 13px; line-height: 1.4; color: #9a9aa8;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .host-live .host-name { color: #17171c; font-weight: 700; }

</style>
</head>
<body>
  <div class="card">
    <div class="inner">
      <div class="head">
        <div>
          <div class="head-title">{{title_text}}</div>
          <div class="head-summary">{{summary_text}}</div>
        </div>
        <span class="head-mark"><i></i><i></i><i></i></span>
      </div>
      <div class="grid">{{grid}}</div>
    </div>
  </div>
</body>
</html>

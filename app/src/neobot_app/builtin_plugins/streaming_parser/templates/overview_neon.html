<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=720">
{{font_style}}
<style>
  /* ===== 霓虹暗色风格 · 开播状态总览图（原创，纯 CSS 绘制） ===== */
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; width: 720px; background-color: #0d0b1c; }
  body {
    font-family: "FusionPixel", "Rajdhani", "Microsoft YaHei", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .card {
    position: relative; width: 720px; overflow: hidden;
    padding: 26px 26px 24px;
    background-color: #0d0b1c;
    background-image:
      radial-gradient(620px 400px at 88% -12%, rgba(34, 225, 255, .20) 0%, rgba(34, 225, 255, 0) 62%),
      radial-gradient(560px 400px at -6% 108%, rgba(164, 107, 255, .22) 0%, rgba(164, 107, 255, 0) 62%),
      linear-gradient(180deg, #0a0e1a 0%, #0d0b1c 100%);
  }
  .card::before {
    content: ""; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    background-image:
      linear-gradient(rgba(120, 200, 255, .055) 1px, transparent 1px),
      linear-gradient(90deg, rgba(120, 200, 255, .055) 1px, transparent 1px);
    background-size: 40px 40px; pointer-events: none;
  }
  .card::after {
    content: ""; position: absolute; top: 0; left: 0; right: 0; height: 2px;
    background: linear-gradient(90deg, rgba(34, 225, 255, 0) 0%, #22e1ff 32%, #a46bff 68%, rgba(164, 107, 255, 0) 100%);
    pointer-events: none;
  }

  .inner {
    position: relative;
    background: linear-gradient(180deg, rgba(20, 26, 46, .92) 0%, rgba(15, 16, 32, .94) 100%);
    border: 1px solid rgba(34, 225, 255, .30);
    border-radius: 20px; padding: 22px 22px 20px;
    box-shadow:
      0 0 0 1px rgba(164, 107, 255, .16),
      0 0 32px rgba(34, 225, 255, .16),
      0 0 70px rgba(164, 107, 255, .12),
      inset 0 1px 0 rgba(180, 235, 255, .10);
  }

  .head {
    display: flex; align-items: flex-end; justify-content: space-between; gap: 16px;
    padding-bottom: 16px; margin-bottom: 18px;
    border-bottom: 1px solid rgba(34, 225, 255, .18);
  }
  .head-title {
    font-size: 24px; line-height: 1.3; font-weight: 700; letter-spacing: .03em;
    color: #eaf7ff;
    text-shadow: 0 0 14px rgba(34, 225, 255, .55), 0 0 34px rgba(34, 225, 255, .28);
  }
  .head-title::before {
    content: ""; display: inline-block; vertical-align: 3px;
    width: 8px; height: 8px; margin-right: 9px; border-radius: 50%;
    background: #22e1ff; box-shadow: 0 0 10px #22e1ff, 0 0 20px rgba(34, 225, 255, .8);
  }
  .head-summary { margin-top: 7px; font-size: 13px; letter-spacing: .04em; color: #8ba1c2; }
  .head-summary:empty { display: none; }
  .head-mark { flex: 0 0 auto; display: inline-flex; align-items: flex-end; gap: 4px; height: 20px; }
  .head-mark i { display: block; width: 4px; border-radius: 2px; background: rgba(34, 225, 255, .30); }
  .head-mark i:nth-child(1) { height: 8px; }
  .head-mark i:nth-child(2) { height: 14px; }
  .head-mark i:nth-child(3) { height: 20px; background: #22e1ff; box-shadow: 0 0 10px #22e1ff; }

  .grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 22px 14px;
  }

  /* ===== 主播格子（由渲染端生成 grid 片段，类名契约固定） ===== */
  .host {
    display: flex; flex-direction: column; align-items: center; gap: 12px;
    min-width: 0; padding-top: 8px;
  }
  .host-avatar {
    position: relative; display: inline-flex; flex: 0 0 auto;
    width: 88px; height: 88px; border-radius: 50%;
  }
  .host-avatar img {
    width: 100%; height: 100%; border-radius: 50%; object-fit: cover; display: block;
    background: linear-gradient(135deg, #16203a, #241a3d);
  }
  /* 开播中：B 站同款粉色圈圈 + 霓虹辉光 */
  .host-live .host-avatar::before {
    content: ""; position: absolute; top: -7px; left: -7px; right: -7px; bottom: -7px;
    border-radius: 50%; border: 3px solid #fb7299;
    box-shadow: 0 0 14px rgba(251, 114, 153, .85), 0 0 30px rgba(251, 114, 153, .45);
  }
  .host:not(.host-live) .host-avatar { opacity: .62; }
  .host-live .host-avatar img { box-shadow: 0 0 0 3px #121a2e, 0 0 18px rgba(251, 114, 153, .5); }
  /* LIVE 角标 */
  .host-badge {
    display: none; position: absolute; right: -9px; bottom: -1px;
    align-items: center; padding: 2px 6px; border-radius: 5px;
    font-size: 9px; font-weight: 700; letter-spacing: .12em; line-height: 1.5;
    color: #ffffff; background: linear-gradient(135deg, #fb7299, #a46bff);
    border: 2px solid #121a2e;
    box-shadow: 0 0 12px rgba(251, 114, 153, .8);
  }
  .host-live .host-badge { display: inline-flex; }
  .host-name {
    width: 100%; text-align: center;
    font-size: 13px; line-height: 1.4; color: #7d90ad;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .host-live .host-name {
    color: #ff9dc0; font-weight: 700;
    text-shadow: 0 0 10px rgba(251, 114, 153, .7);
  }

</style>
</head>
<body>
  <div class="card">
    <div class="inner">
      <div class="head">
        <div>
          <div class="head-title">{{title_text}}</div>
          <div class="head-summary">{{summary_text}}</div>
        </div>
        <span class="head-mark"><i></i><i></i><i></i></span>
      </div>
      <div class="grid">{{grid}}</div>
    </div>
  </div>
</body>
</html>
